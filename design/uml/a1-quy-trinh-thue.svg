y]</text><text x="538" y="543" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#4b5568">[trả máy]</text><path d="M640 576 L740 576" fill="none" stroke="#3b4557" stroke-width="1.25"/><path d="M729 570.5 L740 576 L729 581.5" fill="none" stroke="#3b4557" stroke-width="1.25"/><path d="M860 596 L860 619" fill="none" stroke="#3b4557" stroke-width="1.25"/><path d="M865.5 608 L860 619 L854.5 608" fill="none" stroke="#3b4557" stroke-width="1.25"/><circle cx="860" cy="630" r="11" fill="#ffffff" stroke="#0f1726" stroke-width="1.5"/><circle cx="860" cy="630" r="6.5" fill="#0f1726" stroke="#0f1726" stroke-width="1.25"/><rect x="60" y="83" width="220" height="42" rx="12" fill="#ffffff" stroke="#3b4557" stroke-width="1.2"/><text x="170" y="108.3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">Xem máy trống, gửi yêu cầu thuê</text><rect x="740" y="81" width="240" height="46" rx="12" fill="#ffffff" stroke="#3b4557" stroke-width="1.2"/><text x="860" y="100.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">Lưu yêu cầu PENDING,</text><text x="860" y="116" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">tăng số việc chờ trên menu</text><rect x="420" y="150" width="220" height="40" rx="12" fill="#ffffff" stroke="#3b4557" stroke-width="1.2"/><text x="530" y="174.3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">Xem yêu cầu, kiểm tra máy</text><rect x="325" y="254" width="118" height="52" rx="12" fill="#ffffff" stroke="#3b4557" stroke-width="1.2"/><text x="384" y="276.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">Từ chối và báo</text><text x="384" y="292" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">lý do cho khách</text><rect x="740" y="257" width="240" height="46" rx="12" fill="#ffffff" stroke="#3b4557" stroke-width="1.2"/><text x="860" y="276.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">Tạo đơn RESERVED, máy chuyển</text><text x="860" y="292" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">Giữ chỗ, báo cho khách</text><rect x="420" y="330" width="220" height="40" rx="12" fill="#ffffff" stroke="#3b4557" stroke-width="1.2"/><text x="530" y="354.3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">Giao máy cho khách</text><rect x="740" y="330" width="240" height="40" rx="12" fill="#ffffff" stroke="#3b4557" stroke-width="1.2"/><text x="860" y="354.3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">Đơn ACTIVE, máy Đang thuê</text><rect x="420" y="399" width="220" height="46" rx="12" fill="#ffffff" stroke="#3b4557" stroke-width="1.2"/><text x="530" y="418.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">Thu tiền: tiền mặt,</text><text x="530" y="434" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">chuyển khoản hoặc trừ ví</text><rect x="740" y="399" width="240" height="46" rx="12" fill="#ffffff" stroke="#3b4557" stroke-width="1.2"/><text x="860" y="418.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">Ghi bút toán ba giá trị:</text><text x="860" y="434" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">cash, wallet, revenue</text><rect x="60" y="483" width="220" height="46" rx="12" fill="#ffffff" stroke="#3b4557" stroke-width="1.2"/><text x="170" y="502.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">Xin gia hạn trên cổng,</text><text x="170" y="518" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">hoặc gia hạn tại quầy</text><rect x="420" y="556" width="220" height="40" rx="12" fill="#ffffff" stroke="#3b4557" stroke-width="1.2"/><text x="530" y="580.3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">Nhận lại máy, hoàn tất đơn</text><rect x="740" y="556" width="240" height="40" rx="12" fill="#ffffff" stroke="#3b4557" stroke-width="1.2"/><text x="860" y="580.3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f1726">Đơn COMPLETED, máy về Sẵn sàng</text><path d="M36 196 H294 L304 206 V301.08000000000004 H36 Z" fill="#fdf4e3" stroke="#d9b979" stroke-width="1"/><path d="M294 196 V206 H304" fill="none" stroke="#d9b979" stroke-width="1"/><text x="46" y="214.5" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#3d3423">Đơn tạo ngay tại quầy bỏ qua các bước</text><text x="46" y="229.7" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#3d3423">yêu cầu và duyệt, vào thẳng Giao máy.</text><text x="46" y="244.9" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#3d3423"></text><text x="46" y="260" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#3d3423">Quá hạn mà chưa gia hạn: bộ quét tự</text><text x="46" y="275.2" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#3d3423">khoá mạng máy sau thời gian ân hạn</text><text x="46" y="290.4" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#3d3423">(Hình A2), gia hạn xong tự mở lại.</text></svg>