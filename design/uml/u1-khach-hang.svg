-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#3d3423">Mọi chức năng trừ Đăng ký đều cần đăng nhập. Khách</text><text x="650" y="503.7" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#3d3423">bị khoá (BLOCKED) không đăng nhập được (BR.07).</text><text x="650" y="518.9" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#3d3423">Yêu cầu thuê chỉ thành đơn khi nhân viên duyệt (Hình U2).</text><text x="650" y="534" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#3d3423">Trả bằng ví bị chặn nếu ví không đủ: ví không âm (BR.06).</text><ellipse cx="420" cy="72" rx="130" ry="25" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="420" y="76.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Đăng ký tài khoản</text><ellipse cx="420" cy="140" rx="130" ry="25" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="420" y="144.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Đăng nhập bằng SĐT hoặc email</text><ellipse cx="420" cy="208" rx="130" ry="25" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="420" y="212.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Xem máy đang trống</text><ellipse cx="420" cy="276" rx="130" ry="25" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="420" y="280.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Theo dõi đơn thuê và yêu cầu</text><ellipse cx="420" cy="344" rx="130" ry="25" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="420" y="348.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Xem số dư và lịch sử ví</text><ellipse cx="420" cy="412" rx="130" ry="25" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="420" y="416.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Gửi ticket hỗ trợ</text><ellipse cx="420" cy="480" rx="130" ry="25" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="420" y="484.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Xem thông báo</text><ellipse cx="420" cy="548" rx="130" ry="25" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="420" y="552.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Đổi mật khẩu</text><ellipse cx="815" cy="72" rx="140" ry="25" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="815" y="68.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Hoàn thiện hồ sơ:</text><text x="815" y="84.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">họ tên, CCCD, địa chỉ</text><ellipse cx="815" cy="196" rx="140" ry="25" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="815" y="200.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Gửi yêu cầu thuê, xem giá tạm tính</text><ellipse cx="815" cy="262" rx="140" ry="25" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="815" y="266.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Trả đơn bằng ví</text><ellipse cx="815" cy="328" rx="140" ry="25" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="815" y="332.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Xin gia hạn</text><ellipse cx="815" cy="394