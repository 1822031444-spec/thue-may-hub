ext x="345" y="526.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Tự khoá / mở mạng máy quá hạn</text><ellipse cx="345" cy="600" rx="122" ry="26" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="345" y="604.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Gửi tóm tắt đơn sắp hết hạn</text><ellipse cx="700" cy="135" rx="128" ry="26" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="700" y="139.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Quản lý khách hàng</text><ellipse cx="700" cy="200" rx="128" ry="26" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="700" y="204.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Quản lý thiết bị</text><ellipse cx="700" cy="265" rx="128" ry="26" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="700" y="261.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Tạo đơn thuê, giao máy,</text><text x="700" y="277.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">thu tiền, gia hạn</text><ellipse cx="700" cy="330" rx="128" ry="26" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="700" y="326.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">Duyệt yêu cầu thuê,</text><text x="700" y="342.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726">trả lời ticket</text><ellipse cx="700" cy="395" rx="128" ry="26" fill="#7350cf" fill-opacity="0.09" stroke="#3b4557" stroke-width="1.1"/><text x="700" y="399.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f1726